name: Testes E2E (Cypress)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Executar os testes com Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: chrome
          # Os 10 testes são independentes entre si; rodam em sequência para não
          # sobrecarregar o site público.

      - name: Publicar relatório HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mochawesome
          path: cypress/reports
          if-no-files-found: warn

      - name: Publicar screenshots das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-falhas
          path: cypress/screenshots
          if-no-files-found: ignore
